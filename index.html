<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTIX MANAGER - Login</title>
    <!-- Google Fonts: Prompt & Cinzel for Luxury Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Deep Dark Background with Subtle Center Glow */
        body {
            background-color: #0b0b0b;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(180, 130, 30, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(150, 100, 20, 0.04) 0%, transparent 50%);
            min-height: 100vh;
        }

        /* Gold Gradient Text Effect */
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF0B3 0%, #E2B755 40%, #A67C1E 75%, #F7DA83 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Gold Gradient Button Background & Hover Animation */
        .gold-gradient-bg {
            background: linear-gradient(135deg, #FAD675 0%, #D4A338 45%, #AA7B1C 80%, #E2C066 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-gradient-bg:hover {
            background-position: right center;
            background-image: linear-gradient(135deg, #FFE494 0%, #E5B242 45%, #C48E22 80%, #F5D57B 100%);
        }

        /* Input Field Gold Glow Border & Hover Effects */
        .gold-border-glow {
            border: 1px solid rgba(212, 163, 56, 0.3);
            box-shadow: 0 0 10px rgba(212, 163, 56, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-border-glow:hover {
            border-color: rgba(245, 211, 119, 0.6);
            box-shadow: 0 0 14px rgba(226, 183, 85, 0.18);
            transform: translateY(-1px);
        }

        .gold-border-glow:focus-within {
            border-color: rgba(245, 211, 119, 0.9);
            box-shadow: 0 0 20px rgba(226, 183, 85, 0.35), inset 0 0 8px rgba(226, 183, 85, 0.15);
            transform: translateY(-2px);
        }

        /* Icon Hover Effect inside Inputs */
        .input-group:hover .input-icon,
        .gold-border-glow:focus-within .input-icon {
            color: #ffe494;
            transform: scale(1.15) rotate(-5deg);
        }

        .input-icon {
            transition: all 0.3s ease;
        }

        /* Main Login Button Glow & Animation Effect */
        .gold-btn-glow {
            box-shadow: 0 4px 22px rgba(212, 163, 56, 0.35), 0 0 8px rgba(255, 224, 130, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-btn-glow:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 30px rgba(212, 163, 56, 0.55), 0 0 15px rgba(255, 224, 130, 0.3);
        }

        .gold-btn-glow:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 10px rgba(212, 163, 56, 0.25);
        }

        /* Button Shine Effect on Hover */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }

        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn-shine:hover::after {
            left: 130%;
        }

        /* Circular Logo Frame Hover Animation */
        .logo-circle-frame {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container:hover .logo-frame-outer {
            transform: scale(1.08);
            border-color: rgba(251, 191, 36, 0.9);
            box-shadow: 0 0 28px rgba(226, 183, 85, 0.5);
        }

        .logo-container:hover .logo-frame-inner {
            transform: scale(0.95);
            border-color: rgba(254, 243, 199, 0.7);
        }

        .logo-container:hover .logo-img {
            transform: scale(1.08);
            filter: drop-shadow(0 0 8px rgba(255, 240, 179, 0.6));
        }

        .logo-img {
            transition: all 0.3s ease;
        }

        /* Animated Underline for Links */
        .hover-underline {
            position: relative;
        }

        .hover-underline::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, #FFF0B3, #E2B755);
            transition: width 0.3s ease-in-out;
        }

        .hover-underline:hover::after {
            width: 100%;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans select-none antialiased text-gray-200">

    <!-- Center Container UI -->
    <div class="w-full max-w-sm sm:max-w-md flex flex-col justify-between py-8 px-4 sm:px-6">

        <!-- Logo Section -->
        <div class="flex flex-col items-center justify-center text-center mb-10 logo-container cursor-pointer">
            <!-- Circular Logo Frame -->
            <div class="relative w-24 h-24 mb-5 flex items-center justify-center">
                <!-- Outer Glowing Circle Frame -->
                <div class="logo-circle-frame logo-frame-outer absolute inset-0 rounded-full border-2 border-amber-400/60 shadow-[0_0_18px_rgba(226,183,85,0.25)]"></div>
                <!-- Inner Circle Frame -->
                <div class="logo-circle-frame logo-frame-inner absolute inset-1.5 rounded-full border border-amber-200/35"></div>
                
                <!-- Circular Full Logo Image -->
                <img src="logo/vantix-logo.png" alt="VANTIX Logo" class="logo-img w-full h-full object-cover rounded-full p-1 relative z-10">
            </div>

            <!-- Brand Title & Subtitle -->
            <h1 class="font-serif text-2xl sm:text-3xl tracking-[0.2em] font-bold gold-gradient-text uppercase mb-1.5 transition-all duration-300 hover:tracking-[0.25em]">
                VANTIX MANAGER
            </h1>
            <p class="text-xs tracking-[0.2em] text-amber-100/60 uppercase font-light">
                Access Your Account
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- Username Input Box -->
            <div class="input-group relative flex items-center rounded-2xl gold-border-glow bg-[#131313]/95 overflow-hidden py-0.5">
                <div class="pl-4 pr-2 text-amber-300/80 text-lg flex items-center justify-center">
                    <i class="fa-regular fa-user input-icon"></i>
                </div>
                <input 
                    type="text" 
                    id="username"
                    required
                    placeholder="ชื่อผู้ใช้" 
                    class="w-full py-3.5 pr-4 bg-transparent text-sm text-amber-50 placeholder-amber-100/35 focus:outline-none font-light"
                >
            </div>

            <!-- Password Input Box -->
            <div class="input-group relative flex items-center rounded-2xl gold-border-glow bg-[#131313]/95 overflow-hidden py-0.5">
                <div class="pl-4 pr-2 text-amber-300/80 text-lg flex items-center justify-center">
                    <i class="fa-solid fa-lock input-icon"></i>
                </div>
                <input 
                    type="password" 
                    id="password"
                    required
                    placeholder="รหัสผ่าน" 
                    class="w-full py-3.5 pr-10 bg-transparent text-sm text-amber-50 placeholder-amber-100/35 focus:outline-none font-light"
                >
                <!-- Toggle Password Visibility Icon -->
                <button 
                    type="button" 
                    onclick="togglePasswordVisibility()" 
                    class="absolute right-3.5 text-amber-100/40 hover:text-amber-300 focus:outline-none text-sm p-1 transition-all duration-200 hover:scale-110 active:scale-95"
                >
                    <i id="togglePasswordIcon" class="fa-regular fa-eye-slash"></i>
                </button>
            </div>

            <!-- Key / License Key Input Box -->
            <div class="input-group relative flex items-center rounded-2xl gold-border-glow bg-[#131313]/95 overflow-hidden py-0.5">
                <div class="pl-4 pr-2 text-amber-300/80 text-lg flex items-center justify-center">
                    <i class="fa-solid fa-key input-icon"></i>
                </div>
                <input 
                    type="text" 
                    id="accessKey"
                    required
                    placeholder="คีย์เข้าใช้งาน (Access Key)" 
                    class="w-full py-3.5 pr-4 bg-transparent text-sm text-amber-50 placeholder-amber-100/35 focus:outline-none font-light tracking-wide"
                >
            </div>

            <!-- Forgot Password Link -->
            <div class="flex justify-end pt-1">
                <a href="ลืมรหัส.html" class="hover-underline text-xs text-amber-100/60 hover:text-amber-300 transition-colors duration-200 font-light tracking-wide">
                    ลืมรหัสผ่าน?
                </a>
            </div>

            <!-- Main Login Button -->
            <div class="pt-3">
                <button 
                    type="submit" 
                    class="btn-shine w-full py-3.5 rounded-2xl gold-gradient-bg text-black font-semibold text-base tracking-wide gold-btn-glow flex items-center justify-center"
                >
                    <span class="transition-transform duration-200 group-hover:scale-105">เข้าสู่ระบบ</span>
                </button>
            </div>
        </form>

        <!-- Custom Notification Message Box -->
        <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-[#1a1a1a] border border-amber-400/40 text-amber-100 px-4 py-3 rounded-xl shadow-2xl text-xs text-center transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
            <span id="toastMessage"></span>
        </div>

    </div>

    <!-- JavaScript Interactive Logic -->
    <script>
        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }


        const SUCCESS_REDIRECT = '/dashboard.html';

        async function postJSON(url, payload) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return await res.json();
            } catch (e) {
                return { success: false, message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาเปิด api-server.bat และ web-server.bat แล้วเข้าผ่าน http://127.0.0.1:8080' };
            }
        }

        // Form Submit Handler
        async function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            const data = await postJSON('/api/login', {
                identity: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim(),
                license_key: document.getElementById('accessKey').value.trim()
            });
            btn.disabled = false;
            showToast(data.message);
            if (data.success) {
                sessionStorage.setItem('vantix_user', data.username);
                setTimeout(() => { window.location.href = data.redirect || SUCCESS_REDIRECT; }, 650);
            }
        }

        // Forgot Password Link Handler
        function handleForgotPassword(event) {
            event.preventDefault();
            window.location.href = 'ลืมรหัส.html';
        }

        // Toast Message Helper Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
